# Guest addresses src/game_hooks.cpp calls or reads, at their place in the 1.0 code image
# (canonical, like the analysis TOMLs). tools/release_analysis.py emits them for the code image
# being built into guest_addresses.h; the port tables in releases/ map them to other images.

# Guest functions the hooks call.
[code]
# Makes a string id from a string table key (out, owner, key).
kMakeLocString = 0x822B1AE8
# Makes a menu label from a string id (out, string id).
kMakeMenuLabel = 0x82971220
# Adds an item to a menu (menu, label, action, 1, 0).
kMenuAddItem = 0x8266FF00
# Takes a prompt out of a prompt bar's data source (source, index).
kPromptSourceRemove = 0x8266FB20
# Puts a prompt into a prompt bar's data source (source, index, button, label, icon path, button, gap f1, 1).
kPromptSourceInsert = 0x82673AD8
# Shows the game's YES / NO box over a screen (screen, message, title, on YES, on NO, sound, 0).
kShowYesNo = 0x824EF660
# Makes a screen callback for a box's button (holder, {screen, id}): it copies the pair.
kMakeScreenCallback = 0x824EDDE8
# Sets an element's x through its property holder (holder, f1).
kSetElementX = 0x8237B428
# The string lookup Fm4GraphicsOptionText hooks (its entry), called for the original text.
kStringLookup = 0x823A4780
# Assigns a text element's wide string (string, text, length), as its SetText does.
kTextAssign = 0x82360E98
# Where a scene text element's setup resumes after its string's GetText (the string lookup's
# caller's return address); the element is the caller's r31.
kTextSetupGetTextReturn = 0x8234FDA4

# QUICK RESTART: the pause menu's "restart confirmed" handler (this = the pause menu), what
# its RESTART box's YES button calls back.
kPauseMenuRestartConfirmed = 0x825A9C40
# QUICK RESTART: the pre-race screen's START RACE (this = the screen), its press handler's
# item 7: sets the race going and asks the screen manager for the race.
kPreRaceStartRace = 0x825C1630
# The game database's query (out, database, sql): `out` gets a counted reference to the result,
# released through its vtable's third entry (Fm4DatabaseQuery hooks its entry).
kDatabaseQuery = 0x82856880

# Adds an item to a menu list (list, action, label, 0, -1, -, 1; f1 = the item's height), as the
# livery editor's layer menus add theirs.
kListAddItem = 0x82672C40

# Guest data the hooks read.

# The mouse in menus (src/menu_mouse.cpp).
# Moves a CTuneSlider by whole steps (slider, f1 = steps).
kSliderSteps = 0x82649340
# Moves a grid's focus to a cell.
kGridGoTo = 0x82641858
# Lays a scrolled list out and moves its focus.
kListSetFocus = 0x826209F0
# Adjusts the placed livery layer as the stick does.
kLiveryAdjust = 0x823FCE08
# The livery editor's edits group (the stick's branch).
kLiveryEditsGroup = 0x823E98D8
# The livery editor's adjust group (the stick's branch).
kLiveryAdjustGroup = 0x823F7CE8
# Shows a livery layer's change on the screen's readouts.
kLiveryShowChange = 0x82515030
# Tells the livery screen its layer changed.
kLiveryChanged = 0x825221D0
# Wakes a screen that hid its menu when idle.
kScreenWake = 0x824E4A60
# The game's tick clock.
kGameTicks = 0x8234BD70
# Shows the pre-race menu again.
kPreRaceShow = 0x825BED40
# Restarts a screen timer.
kTimerRestart = 0x822D59C0
# Moves a focus group to a control.
kGroupSetFocus = 0x824C2B10
# Sets an element's y through its property holder (holder, f1).
kSetElementY = 0x8298DF70

[data]
# CSplash's vtable (the title screen and main menu).
kSplashVtable = 0x8204649C
# The gap between a prompt bar's prompts (float).
kPromptGap = 0x82000F28
# The prompt icon paths: 11 per prompt style.
kPromptIcons = 0x82D6EDC0
# The help buttons' string table (the prompts' labels).
kHelpButtonsTable = 0x8200A364
# IDS_Back's string key, set by the game at start.
kBackStringKey = 0x82DE05C4
# The YES / NO box's sound.
kYesNoSound = 0x82E025D4
# The hash of READY_FOR_TROPHY, set by the game at start (a World Tour scene event).
kWorldTourReadyForTrophy = 0x82DDEEDC
# Holds the render scenario manager.
kScenarioManagerPointer = 0x82DC3750
# Each scenario control's offset, indexed by control id.
kControlOffsetTable = 0x82D59FF0
# QUICK RESTART's short start, the parsed 321Tuning.xml and 321Cams.xml (read as the first race
# loads): OverrideRevsDuration (a float), and before it the slot of the start sequence's
# controller, which keeps the duration plus one second at +8.
kStartDuration = 0x82DDB130
kStartControllerSlot = 0x82DDB12C
# PreRaceCamsFadeOut's Duration (a float).
kPreRaceCamsFade = 0x82DDB1D0
# The AI's and the player's rev keyframes: vectors (begin pointer first) of
# {average, deviation, throttle, target, timeout} floats.
kAiRevKeyframes = 0x82DDB1A4
kHumanRevKeyframes = 0x82DDB24C
# The start cameras (321Cams.xml): a pointer to them, 0x1B0 bytes each, with each camera's
# fade in {duration, hold} at +0x10 and fade out duration at +0x30.
kStartCams = 0x82DDF344
# Holds the UI object manager. Its slot 59 (+0xEC) plays one of ui4audio.xml's events:
# (manager, scene key, sound id), the key only looked up in the scenes' sound overrides, 0 for
# none. A UI element's PlaySound (the element vtable's slot 31, 0x8297F1C8) calls it with its
# root's key.
kUiManagerPointer = 0x82DC36CC
# The ids of ui4audio.xml's UI sound events, each made from its name by a static initializer:
# NewObjectFocus, Spinner, SpinnerEnd, SliderStep_Increment, SliderStep_Decrement, SliderEnd,
# TabLeft, TabRight, Accept, Cancel and PopupError.
kUiSoundMove = 0x82E022A8
kUiSoundSpinner = 0x82E025C0
kUiSoundSpinnerEnd = 0x82E024F4
kUiSoundSliderUp = 0x82E02148
kUiSoundSliderDown = 0x82E02334
kUiSoundSliderEnd = 0x82E024D0
kUiSoundTabLeft = 0x82E025B4
kUiSoundTabRight = 0x82E023B4
kUiSoundAccept = 0x82E024A0
kUiSoundCancel = 0x82E023A8
kUiSoundError = 0x82E024F8

# The mouse in menus (src/menu_mouse.cpp).
# CAnimatedScrollingListCtrl's vtable (a menu list).
kListVtable = 0x8204D1EC
# CTuneSlider's vtable (TUNE SETUP's rows).
kTuneSliderVtable = 0x8202A15C
# CSlider's vtable (photo effects, audio).
kSliderVtable = 0x82053E2C
# CSpinner's vtable (a row of choices).
kSpinnerVtable = 0x82052F1C
# CHelpButtonBar's vtable (the prompt bar).
kBarVtable = 0x82050F9C
# A grid of cells' vtable (colours, vinyls, cars).
kGridVtable = 0x82050B4C
# The list move event forward.
kMoveForward = 0x82E023B4
# The list move event back.
kMoveBack = 0x82E025B4
# CMainMenu's vtable (the career hub).
kMainMenuVtable = 0x8203E384
# The career hub's input handler's vtable.
kMainMenuInputVtable = 0x8203E478
# CLiveryLayerPosition's vtable (placing a livery layer).
kLiveryPlacementVtable = 0x82027924
# CLiveryLayerPosition's second vtable.
kLiveryPlacementVtable2 = 0x82027918
# CUI4PhotoModeCamera's vtable (TAKE PHOTO).
kPhotoCameraVtable = 0x8202695C
# CPhotoModeIngame's vtable (a race's photo mode).
kRacePhotoVtable = 0x820421A4
# CPreRace's vtable (the pre-race menu).
kPreRaceVtable = 0x820438FC
# The car colour screen's vtable.
kCarColorVtable = 0x82027614
# CLiveryColorSelect's vtable (PAINT CAR's colour choice and a layer's colour).
kLiveryColorSelectVtable = 0x82027184
# CLiveryLayerSelect's vtable (the livery editor's layers).
kLiveryLayerSelectVtable = 0x8202728C
# CUI4CtrlFocusGroup's vtable (which control the D-pad works).
kGroupVtable = 0x8202DA0C
# The Kinect cursor singleton's pointer (Autovista's parts).
kNatalCursorPointer = 0x82E10C1C
# CCarPartSelect's vtable (an Autovista part marker).
kCarPartVtable = 0x8204D9B4
# CCarPartAnimate's vtable (the Autovista viewer's doors, bonnet, boot, spoiler: A opens or closes them).
kCarPartAnimateVtable = 0x8204D78C
# CUI4NatalCarWalkaroundCamera's vtable (Autovista's camera).
kWalkaroundCameraVtable = 0x8202D9CC
# CNatalHomespace's vtable.
kHomespaceVtable = 0x8203F7EC
# A prompt button's vtable.
kHelpButtonVtable = 0x82050E1C
# CButton's vtable.
kButtonVtable = 0x8204D5B4
# CButtonText's vtable.
kButtonTextVtable = 0x820295A4
# CButtonTexture's vtable.
kButtonTextureVtable = 0x8202969C
# CButtonTextAndTexture's vtable.
kButtonTextAndTextureVtable = 0x8202A6B4
# AUTO RESTART ON DIRTY LAP: holds the race's owner, with the race's drivers at +0x310 (a vector
# of driver pointers: begin, end, in race order). A driver's lap state is at its +0x10; the lap is
# dirty while +0x392E, +0x3931 or +0x3932 is set, as the driver's IsLapClean (its vtable's slot 6,
# 0x824A5BD8) tests. The lap timer's warning icon shows the same.
kRaceDriversOwner = 0x82DC3704
# The vtable of a player's controller (a driver's +0x20); an AI driver's is 0x8200254C.
kPlayerControllerVtable = 0x8200265C
